<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Tarifario Grupo Atlante · Avatar AEC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700&display=swap">
<style>
  :root{--ground:#ffffff;--card:#333333;--on-card:#f7f7f4;--muted:#a9b0b4;--teal:#68c4b2;--navy:#26364c;--ink:#1f1f1f;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .gate{width:100%;max-width:420px;display:flex;flex-direction:column;gap:22px}
  .brands{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brands .av{display:flex;align-items:center;gap:12px}
  .brands .av img{width:52px;height:52px;border-radius:6px;display:block}
  .brands .av b{font-weight:900;font-size:16px;letter-spacing:-.01em}
  .brands .cl{height:44px;width:auto;display:block}
  form{background:var(--card);color:var(--on-card);border-radius:28px;padding:26px 26px 24px;display:flex;flex-direction:column;gap:14px}
  .kicker{font-family:var(--mono);font-weight:700;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--teal)}
  h1{margin:0;font-size:20px;font-weight:900;letter-spacing:-.02em}
  p{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
  label{font-size:11px;font-weight:600}
  input[type=password]{width:100%;height:44px;border-radius:10px;border:1px solid #5a5a5a;background:#fff;color:var(--ink);padding:0 12px;font:500 15px var(--sans)}
  input:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
  .remember{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:500}
  button{height:44px;border:0;border-radius:999px;background:var(--teal);color:var(--ink);font:900 11px var(--sans);letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
  button:hover{background:var(--on-card)}
  button:focus-visible{outline:2px solid var(--on-card);outline-offset:2px}
  button:disabled{opacity:.6;cursor:wait}
  .err{font-size:12px;color:var(--ink);background:#f2b8b5;border-radius:8px;padding:8px 10px}
  .foot{font-size:11px;color:#6b7378;text-align:center}
</style>
</head>

  var KEY_STORE="avatar-atlante-key";
  var b64=function(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a};
  var tob64=function(buf){var a=new Uint8Array(buf),s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
  async function derive(pw){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
    return await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(DATA.salt),iterations:DATA.it,hash:"SHA-256"},base,256);
  }
  async function open(raw){
    var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(DATA.iv)},key,b64(DATA.ct));
    var ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    var html=await new Response(ds).text();
    return html.split("%%AVLOGO%%").join(document.querySelector(".av img").src).split("%%ATLOGO%%").join(document.querySelector(".cl").src);
  }
  function show(html){document.open();document.write(html);document.close()}
  async function tryStored(){
    try{var k=localStorage.getItem(KEY_STORE);if(!k)return;show(await open(b64(k)))}catch(e){try{localStorage.removeItem(KEY_STORE)}catch(_){}}
  }
  tryStored();
  document.getElementById("f").addEventListener("submit",async function(ev){
    ev.preventDefault();var btn=document.getElementById("go"),err=document.getElementById("err");
    btn.disabled=true;btn.textContent="Comprobando…";err.hidden=true;
    try{
      var raw=await derive(document.getElementById("pw").value);var html=await open(raw);
      if(document.getElementById("rem").checked){try{localStorage.setItem(KEY_STORE,tob64(raw))}catch(_){}}
      show(html);
    }catch(e){err.hidden=false;btn.disabled=false;btn.textContent="Entrar";document.getElementById("pw").select()}
  });
})();
